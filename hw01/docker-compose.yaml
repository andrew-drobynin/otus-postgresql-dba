services:
  psql:
    container_name: psql
    restart: unless-stopped
    image: alpine/psql:18.6
    stdin_open: true
    tty: true
    environment:
      PGPASSWORD: postgres
    command: -h postgres -U postgres
    depends_on:
      - postgres
  postgres:
    container_name: postgres
    restart: unless-stopped
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    healthcheck:
      test: pg_isready -U postgres
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - ./postgres:/var/lib/postgresql
